version: 2

builds:
  - id: awdev
    main: ./cmd/awdev
    binary: awdev
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/agenticworkflowdev/cli/internal/version.Version={{ .Tag }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - awdev
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
